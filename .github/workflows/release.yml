name: Release

on:
  push:
    branches:
      - main
    paths:
      - version
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          set -euo pipefail
          if [ ! -f version ]; then
            echo "version file not found"
            exit 1
          fi
          version="$(tr -d ' \t\r\n' < version)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must contain three numeric parts, for example 0.1.0."
            exit 1
          fi
          # 0.0.0 is the development version, and Android rejects the versionCode
          # 0 it would produce.
          if [ "$version" = "0.0.0" ]; then
            echo "0.0.0 is the development version. Pass the version to release."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          existing="$(git ls-remote --tags origin "refs/tags/$TAG")"
          if [ -n "$existing" ]; then
            echo "Tag $TAG already exists. Bump version."
            exit 1
          fi

  test:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The runner ships an Android SDK with a current command-line-tools, so the
      # packages the build needs are installed with it directly.
      - name: Install the Android SDK packages
        run: |
          set -euo pipefail
          sdkmanager="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1 || true)"
          if [ -z "$sdkmanager" ]; then
            sdkmanager="$(command -v sdkmanager)"
          fi
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run the unit tests
        run: ./gradlew testDebugUnitTest

  build:
    needs:
      - preflight
      - test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The runner ships an Android SDK with a current command-line-tools, so the
      # packages the build needs are installed with it directly.
      - name: Install the Android SDK packages
        run: |
          set -euo pipefail
          sdkmanager="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1 || true)"
          if [ -z "$sdkmanager" ]; then
            sdkmanager="$(command -v sdkmanager)"
          fi
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      # The release is signed with the repository's key. If the secrets are gone the
      # build fails here, rather than quietly producing a debug-signed APK.
      - name: Require the signing secrets
        env:
          LEGATO_KEYSTORE_BASE64: ${{ secrets.LEGATO_KEYSTORE_BASE64 }}
          LEGATO_KEYSTORE_PASSWORD: ${{ secrets.LEGATO_KEYSTORE_PASSWORD }}
          LEGATO_KEY_ALIAS: ${{ secrets.LEGATO_KEY_ALIAS }}
          LEGATO_KEY_PASSWORD: ${{ secrets.LEGATO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for secret in LEGATO_KEYSTORE_BASE64 LEGATO_KEYSTORE_PASSWORD LEGATO_KEY_ALIAS LEGATO_KEY_PASSWORD; do
            if [ -z "${!secret}" ]; then
              echo "::error::the secret $secret is not set on this repository"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

      - name: Decode the signing key
        env:
          LEGATO_KEYSTORE_BASE64: ${{ secrets.LEGATO_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$LEGATO_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/legato-release.jks"
          echo "LEGATO_KEYSTORE=$RUNNER_TEMP/legato-release.jks" >> "$GITHUB_ENV"

      - name: Build the signed release
        env:
          LEGATO_KEYSTORE_PASSWORD: ${{ secrets.LEGATO_KEYSTORE_PASSWORD }}
          LEGATO_KEY_ALIAS: ${{ secrets.LEGATO_KEY_ALIAS }}
          LEGATO_KEY_PASSWORD: ${{ secrets.LEGATO_KEY_PASSWORD }}
        # No configuration cache: the signing configuration is read from the
        # environment, and a restored cache must never be able to serve a
        # configuration that was built without the key.
        run: ./gradlew :legato:app:assembleRelease --no-configuration-cache

      - name: Verify the signatures
        run: |
          set -euo pipefail
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)"
          shopt -s nullglob
          apks=(legato/app/build/outputs/apk/release/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "::error::no release APK was produced"
            exit 1
          fi
          for apk in "${apks[@]}"; do
            certs="$("$apksigner" verify --print-certs "$apk")"
            if echo "$certs" | grep -q "CN=Android Debug"; then
              echo "::error::$apk is signed with the debug key"
              exit 1
            fi
            echo "signed: $(basename "$apk")"
          done

      # The build makes one APK per ABI plus one that runs anywhere.
      - name: Collect the release assets
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release
          for apk in legato/app/build/outputs/apk/release/*.apk; do
            name="$(basename "$apk")"
            abi="${name#app-}"
            abi="${abi%-release.apk}"
            cp "$apk" "release/legato-${VERSION}-${abi}.apk"
          done
          cd release
          sha256sum ./*.apk > "legato-${VERSION}.sha256"
          cat "legato-${VERSION}.sha256"

      - name: Verify the checksums
        run: |
          set -euo pipefail
          cd release
          sha256sum -c "legato-${{ needs.preflight.outputs.version }}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: legato-${{ needs.preflight.outputs.version }}
          path: release/*
          if-no-files-found: error

      # The key never survives the runner.
      - name: Delete the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/legato-release.jks"

  publish:
    needs:
      - preflight
      - build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: legato-${{ needs.preflight.outputs.version }}
          path: artifacts

      - name: Verify the checksums
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum -c "legato-${{ needs.preflight.outputs.version }}.sha256"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          # The release before this one, for the changelog link. The draft for this
          # release does not exist yet, so the newest published one is the last.
          previous="$(gh release list --limit 1 --json tagName --jq '.[0].tagName' || true)"
          if [ -z "$previous" ]; then previous="$TAG"; fi
          notes="$(sed -e "s|<commit>|$GITHUB_SHA|g" -e "s|<previous>|$previous|g" \
            -e "s|<tag>|$TAG|g" .github/RELEASE_TEMPLATE.md)"
          printf '%s\n' "$notes" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$TAG" artifacts/*.apk artifacts/*.sha256 \
            --draft --target "$GITHUB_SHA" --title "$TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
